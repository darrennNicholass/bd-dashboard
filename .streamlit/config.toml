# Tema dashboard. Aman di-commit: tidak ada rahasia di sini.
# Rahasia (URL spreadsheet, credential) tetap di .env / secrets.toml.
#
# Arah desain (referensi tim BD): SaaS dashboard soft-indigo — latar
# lavender lembut, kartu putih membulat, aksen indigo, tipografi geometris.

[theme]
base = "dark"

# Indigo sebagai warna aksi, biru AIESEC tetap dipakai di grafik sebagai
# warna merek.
primaryColor = "#528EFF"
backgroundColor = "#081222"
secondaryBackgroundColor = "#101D32"
textColor = "#E7EFFF"

# Tipografi: Plus Jakarta Sans (geometris, untuk judul & angka) dipadu
# Inter (badan teks). Dua keluarga font supaya hierarkinya tidak monoton.
font = "Inter, sans-serif"
headingFont = "Plus Jakarta Sans, sans-serif"
baseFontSize = 15

# Sudut membulat dan tanpa garis tegas pada widget, mengikuti referensi.
baseRadius = "1rem"
borderColor = "#2D4263"
showWidgetBorder = false

# Palet Light Mode untuk komponen BAWAAN Streamlit (termasuk isi tabel
# st.dataframe yang digambar di canvas dan tidak bisa diwarnai lewat CSS).
# Tampilan dashboard sendiri tetap dikendalikan pemilih tema di sidebar;
# bagian ini hanya berlaku kalau tema dasar Streamlit diubah menjadi light
# dari menu Appearance milik Streamlit. Dark Mode tidak terpengaruh.
[theme.light]
primaryColor = "#2563B6"
backgroundColor = "#FBFDFF"
secondaryBackgroundColor = "#F2F7FE"
textColor = "#152945"
borderColor = "#DEE8F6"
dataframeHeaderBackgroundColor = "#F2F7FE"
showWidgetBorder = true

[server]
# Dashboard memuat nama partner dan nilai kontrak, dan tidak punya
# autentikasi. Saat dijalankan lokal, jangan dengarkan alamat publik.
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
